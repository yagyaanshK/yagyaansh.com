<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Physics Catalog</title>
    <meta name="description" content="An interactive catalog of physics laws with typeset equations and live, parameter-driven simulations.">
    <link rel="icon" type="image/x-icon" href="../../assets/images/art.svg">

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400&family=Poppins:wght@400;600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- KaTeX for typeset equations (vendored locally — no external dependency) -->
    <link rel="stylesheet" href="../../assets/vendor/katex/katex.min.css">
    <script defer src="../../assets/vendor/katex/katex.min.js"></script>

    <style>
        :root {
            --bg: #0b1d40;
            --bg-grad: radial-gradient(1200px 600px at 50% -10%, #18356e 0%, #0b1d40 60%);
            --panel: #11264c;
            --text: #e6edf8;
            --muted: #9fb2d0;
            --card: rgba(255, 255, 255, 0.05);
            --card-bd: rgba(255, 255, 255, 0.12);
            --card-hover: rgba(255, 255, 255, 0.10);
            --head: #ffa75f;
            --accent: #ffa75f;
            --accent2: #ff5733;
            --chip: rgba(255, 255, 255, 0.07);
            --shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
        }
        body.light-theme {
            --bg: #eef3fb;
            --bg-grad: radial-gradient(1200px 600px at 50% -10%, #ffffff 0%, #e6eefb 60%);
            --panel: #ffffff;
            --text: #16243f;
            --muted: #5b6b86;
            --card: #ffffff;
            --card-bd: rgba(17, 38, 76, 0.12);
            --card-hover: #f3f7ff;
            --head: #72001b;
            --accent: #72001b;
            --accent2: #b5341f;
            --chip: rgba(17, 38, 76, 0.05);
            --shadow: 0 18px 40px rgba(17, 38, 76, 0.18);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Quicksand', 'Poppins', sans-serif;
            margin: 0;
            background: var(--bg);
            background-image: var(--bg-grad);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            transition: background-color .3s ease, color .3s ease;
        }

        /* ---------- Top bar ---------- */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px clamp(16px, 4vw, 40px);
            gap: 16px;
        }
        .brand { font-size: .95rem; color: var(--muted); letter-spacing: .02em; }
        .brand a { color: var(--muted); text-decoration: none; }
        .brand a:hover { color: var(--accent); }
        .ghost-btn {
            background: var(--chip);
            border: 1px solid var(--card-bd);
            color: var(--text);
            font-family: inherit;
            font-size: .9rem;
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: background .2s ease, transform .15s ease;
        }
        .ghost-btn:hover { background: var(--card-hover); transform: translateY(-1px); }

        /* ---------- Hero ---------- */
        header.hero {
            text-align: center;
            padding: clamp(1rem, 4vw, 2.5rem) 1rem 1rem;
        }
        header.hero h1 {
            color: var(--head);
            font-size: clamp(2rem, 5vw, 4rem);
            margin: 0;
            font-weight: 400;
        }
        header.hero p {
            color: var(--muted);
            max-width: 620px;
            margin: .8rem auto 0;
            font-size: clamp(.95rem, 2.5vw, 1.15rem);
            line-height: 1.5;
        }

        /* ---------- Toolbar ---------- */
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 20;
            backdrop-filter: blur(10px);
            background: color-mix(in srgb, var(--bg) 78%, transparent);
            border-bottom: 1px solid var(--card-bd);
            padding: 12px clamp(16px, 4vw, 40px);
            margin-top: 1rem;
        }
        .toolbar-inner { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
        .search-wrap { position: relative; }
        .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; opacity: .55; }
        #search {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border-radius: 12px;
            border: 1px solid var(--card-bd);
            background: var(--card);
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color .2s ease;
        }
        #search:focus { border-color: var(--accent); }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            border: 1px solid var(--card-bd);
            background: var(--chip);
            color: var(--text);
            font-family: inherit;
            font-size: .85rem;
            padding: 6px 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: all .18s ease;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }
        .chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--accent)); }
        .chip:hover { background: var(--card-hover); }
        .chip.active { background: var(--c, var(--accent)); border-color: transparent; color: #0b1d40; font-weight: 600; }
        .chip.active .dot { background: rgba(11,29,64,.55); }

        /* ---------- Grid ---------- */
        main { max-width: 1100px; margin: 0 auto; padding: 28px clamp(16px, 4vw, 40px) 80px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 18px;
        }
        .card {
            position: relative;
            text-align: left;
            background: var(--card);
            border: 1px solid var(--card-bd);
            border-radius: 16px;
            padding: 20px 18px 18px;
            cursor: pointer;
            font-family: inherit;
            color: var(--text);
            overflow: hidden;
            transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
        }
        .card::before {
            content: "";
            position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
            background: var(--c);
        }
        .card:hover { transform: translateY(-4px); box-shadow: var(--shadow); background: var(--card-hover); }
        .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .card .row { display: flex; align-items: center; gap: 10px; }
        .card .icon { font-size: 1.5rem; line-height: 1; }
        .card .badge {
            font-size: .68rem;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--c);
            font-weight: 600;
        }
        .card h3 { margin: 12px 0 10px; font-size: 1.12rem; color: var(--text); font-weight: 600; }
        .card .eq { color: var(--muted); font-size: 1.05rem; min-height: 1.6em; }
        .card .eq .katex { color: var(--text); }
        .card .hint { margin-top: 12px; font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
        .card .hint svg { width: 13px; height: 13px; }

        .empty { text-align: center; color: var(--muted); padding: 40px 0; display: none; }

        /* ---------- Modal ---------- */
        .overlay {
            position: fixed; inset: 0; z-index: 50;
            background: rgba(4, 12, 28, 0.6);
            backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            padding: 16px;
            opacity: 0; pointer-events: none;
            transition: opacity .2s ease;
        }
        .overlay.open { opacity: 1; pointer-events: auto; }
        .modal {
            position: relative;
            width: min(560px, 100%);
            max-height: 92vh;
            overflow-y: auto;
            background: var(--panel);
            border: 1px solid var(--card-bd);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 26px clamp(18px, 4vw, 30px) 28px;
            transform: translateY(12px) scale(.98);
            transition: transform .22s ease;
        }
        .overlay.open .modal { transform: none; }
        .modal .close {
            position: absolute; top: 14px; right: 14px;
            width: 36px; height: 36px; border-radius: 50%;
            border: 1px solid var(--card-bd); background: var(--chip);
            color: var(--text); font-size: 1.3rem; line-height: 1; cursor: pointer;
            transition: background .18s ease;
        }
        .modal .close:hover { background: var(--card-hover); }
        .m-cat { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--mc); }
        .m-title { margin: 6px 0 4px; font-size: clamp(1.4rem, 4vw, 1.9rem); color: var(--head); }
        .m-eq { margin: 14px 0; font-size: 1.3rem; text-align: center; padding: 14px; background: var(--card); border-radius: 12px; overflow-x: auto; }
        .m-desc { color: var(--text); line-height: 1.55; font-size: .98rem; margin: 0 0 16px; }
        .m-legend { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
        .m-legend .lg { display: flex; align-items: baseline; gap: 10px; font-size: .9rem; color: var(--muted); }
        .m-legend .sym { color: var(--mc); font-weight: 700; min-width: 34px; font-family: 'Poppins', serif; }
        .m-legend .unit { margin-left: auto; font-size: .8rem; opacity: .8; }

        .sim { border-top: 1px solid var(--card-bd); padding-top: 18px; }
        .sim-head { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 12px; }
        canvas#sim { width: 100%; max-width: 420px; aspect-ratio: 320 / 190; display: block; margin: 0 auto 14px; background: var(--card); border-radius: 12px; }
        .m-readout { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; }
        .pill {
            background: var(--chip); border: 1px solid var(--card-bd);
            border-radius: 999px; padding: 6px 14px; font-size: .9rem; color: var(--text);
        }
        .pill b { color: var(--mc); font-weight: 700; }
        .m-controls { display: flex; flex-direction: column; gap: 14px; }
        .ctrl label { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
        .ctrl label .val { color: var(--text); font-weight: 600; }
        input[type=range] {
            -webkit-appearance: none; appearance: none;
            width: 100%; height: 6px; border-radius: 999px;
            background: var(--card-bd); outline: none; cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 18px; height: 18px; border-radius: 50%;
            background: var(--mc); border: 2px solid var(--panel); cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,.3);
        }
        input[type=range]::-moz-range-thumb {
            width: 18px; height: 18px; border-radius: 50%;
            background: var(--mc); border: 2px solid var(--panel); cursor: pointer;
        }

        footer { text-align: center; color: var(--muted); padding: 30px 16px 40px; font-size: .85rem; }
        footer a { color: var(--accent); }

        @media (max-width: 480px) {
            .card h3 { font-size: 1.05rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { scroll-behavior: auto; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand"><a href="../vibe_index.html">&larr; Vibe Code</a> &nbsp;/&nbsp; Physics Catalog</div>
        <button class="ghost-btn" id="themeToggle">◐ Theme</button>
    </div>

    <header class="hero">
        <h1>Interactive Physics Catalog</h1>
        <p>Browse the fundamental laws — every equation is typeset, and every card opens a live simulation you can drive with the sliders.</p>
    </header>

    <div class="toolbar">
        <div class="toolbar-inner">
            <div class="search-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input id="search" type="search" placeholder="Search laws, equations, concepts…" autocomplete="off">
            </div>
            <div class="chips" id="chips"></div>
        </div>
    </div>

    <main>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty">No laws match your search.</div>
    </main>

    <footer>
        Built for <a href="../vibe_index.html">Just Vibing</a> · Equations rendered with KaTeX
    </footer>

    <!-- Modal -->
    <div class="overlay" id="overlay" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
            <button class="close" id="closeBtn" aria-label="Close">&times;</button>
            <div class="m-cat" id="m-cat"></div>
            <h2 class="m-title" id="m-title"></h2>
            <div class="m-eq" id="m-eq"></div>
            <p class="m-desc" id="m-desc"></p>
            <div class="m-legend" id="m-legend"></div>
            <div class="sim">
                <div class="sim-head">Live simulation</div>
                <canvas id="sim" width="320" height="190"></canvas>
                <div class="m-readout" id="m-readout"></div>
                <div class="m-controls" id="m-controls"></div>
            </div>
        </div>
    </div>

    <script>
    "use strict";
    // ---------- constants ----------
    const C = 299792458, G = 6.674e-11, KE = 8.9875e9, H = 6.626e-34, HBAR = 1.0546e-34, G0 = 9.8, QE = 1.602e-19;
    const LW = 320, LH = 190, TAU = Math.PI * 2;

    const CAT_COLORS = {
        'Mechanics': '#ffa75f',
        'Electromagnetism': '#3e82ff',
        'Waves & Optics': '#2ec4a6',
        'Relativity': '#b07bff',
        'Quantum': '#ff6f9c',
        'Fluids': '#38b6ff'
    };

    // ---------- number formatting ----------
    function fmt(v) {
        if (v === null || v === undefined) return '';
        if (!isFinite(v)) return '∞';
        if (v === 0) return '0';
        const a = Math.abs(v);
        if (a >= 1e5 || a < 1e-3) return v.toExponential(2).replace('e', '×10^').replace('+', '');
        if (a >= 100) return v.toFixed(0);
        if (a >= 1) return v.toFixed(2);
        return v.toFixed(3);
    }

    // ---------- canvas palette + helpers ----------
    function pal() {
        const light = document.body.classList.contains('light-theme');
        return {
            light,
            track: light ? 'rgba(17,38,76,0.28)' : 'rgba(255,255,255,0.30)',
            grid: light ? 'rgba(17,38,76,0.10)' : 'rgba(255,255,255,0.10)',
            text: light ? '#16243f' : '#dce6f5'
        };
    }
    function ball(ctx, x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
    function arrow(ctx, x1, y1, x2, y2, c) {
        const a = Math.atan2(y2 - y1, x2 - x1);
        ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x2, y2);
        ctx.lineTo(x2 - 9 * Math.cos(a - 0.45), y2 - 9 * Math.sin(a - 0.45));
        ctx.lineTo(x2 - 9 * Math.cos(a + 0.45), y2 - 9 * Math.sin(a + 0.45));
        ctx.closePath(); ctx.fill(); ctx.lineWidth = 1;
    }
    function trackH(ctx, y, P) { ctx.strokeStyle = P.track; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(LW, y); ctx.stroke(); ctx.lineWidth = 1; }
    function periPoint(x1, y1, x2, y2, d) {
        const w = x2 - x1, h = y2 - y1, peri = 2 * (w + h);
        d = ((d % peri) + peri) % peri;
        if (d < w) return { x: x1 + d, y: y1 }; d -= w;
        if (d < h) return { x: x2, y: y1 + d }; d -= h;
        if (d < w) return { x: x2 - d, y: y2 }; d -= w;
        return { x: x1, y: y2 - d };
    }
    function drawCharge(ctx, x, y, q) {
        const c = q > 0 ? '#ff5733' : (q < 0 ? '#3e82ff' : '#888');
        ball(ctx, x, y, 15, c);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 18px Quicksand';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(q > 0 ? '+' : (q < 0 ? '−' : '0'), x, y + 1);
        ctx.textBaseline = 'alphabetic';
    }
    function clockFace(ctx, cx, cy, phase, P, c, label) {
        ctx.strokeStyle = P.track; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, 30, 0, TAU); ctx.stroke();
        const a = phase * 2 - Math.PI / 2;
        ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.lineTo(cx + 22 * Math.cos(a), cy + 22 * Math.sin(a)); ctx.stroke(); ctx.lineWidth = 1;
        ball(ctx, cx, cy, 3, c);
        ctx.fillStyle = P.text; ctx.font = '13px Quicksand'; ctx.textAlign = 'center';
        ctx.fillText(label, cx, cy + 50);
    }
    function gauss(ctx, cx, base, w, c, label, P) {
        w = Math.max(6, Math.min(46, w));
        ctx.strokeStyle = c; ctx.lineWidth = 2.5; ctx.beginPath();
        for (let i = -70; i <= 70; i += 2) {
            const x = cx + i, y = base - 70 * Math.exp(-(i * i) / (2 * w * w));
            i === -70 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke(); ctx.lineWidth = 1;
        ctx.fillStyle = P.text; ctx.font = '13px Quicksand'; ctx.textAlign = 'center';
        ctx.fillText(label, cx, base + 18);
    }
    function specColor(wl) {
        let r, g, b;
        if (wl < 440) { r = -(wl - 440) / 60; g = 0; b = 1; }
        else if (wl < 490) { r = 0; g = (wl - 440) / 50; b = 1; }
        else if (wl < 510) { r = 0; g = 1; b = -(wl - 510) / 20; }
        else if (wl < 580) { r = (wl - 510) / 70; g = 1; b = 0; }
        else if (wl < 645) { r = 1; g = -(wl - 645) / 65; b = 0; }
        else { r = 1; g = 0; b = 0; }
        return `rgb(${r * 255 | 0},${g * 255 | 0},${b * 255 | 0})`;
    }

    // ---------- the catalog ----------
    const LAWS = [
        {
            id: 'n1', cat: 'Mechanics', title: "Newton's First Law", icon: '🛹',
            latex: '\\sum \\vec{F}=0 \\;\\Rightarrow\\; \\vec{v}=\\text{const}',
            desc: 'An object stays at rest or keeps moving at constant velocity unless acted on by a net external force — the principle of inertia.',
            vars: [['F', 'net force', 'N'], ['v', 'velocity', 'm/s']],
            controls: [{ k: 'v', label: 'Velocity', min: 1, max: 10, step: 0.5, val: 4, unit: 'm/s' }],
            readout: p => [{ l: 'Net force', v: 0, u: 'N' }, { l: 'Velocity', v: p.v, u: 'm/s' }],
            draw(ctx, p, t, P, col) { trackH(ctx, 140, P); const x = ((p.v * 33 * t) % (LW + 40)) - 20; ball(ctx, x, 128, 11, col); }
        },
        {
            id: 'n2', cat: 'Mechanics', title: "Newton's Second Law", icon: '⚙️',
            latex: '\\vec{F}=m\\vec{a}',
            desc: 'A body’s acceleration is proportional to the net force and inversely proportional to its mass.',
            vars: [['F', 'net force', 'N'], ['m', 'mass', 'kg'], ['a', 'acceleration', 'm/s²']],
            controls: [
                { k: 'F', label: 'Force', min: 1, max: 50, step: 1, val: 20, unit: 'N' },
                { k: 'm', label: 'Mass', min: 1, max: 10, step: 0.5, val: 5, unit: 'kg' }
            ],
            readout: p => [{ l: 'Acceleration', v: p.F / p.m, u: 'm/s²' }],
            draw(ctx, p, t, P, col) {
                trackH(ctx, 140, P);
                const a = p.F / p.m, s = 7, D = 330;
                const tc = Math.sqrt(2 * D / (a * s)) || 2;
                const tt = t % tc, x = -15 + 0.5 * a * s * tt * tt;
                ball(ctx, x, 128, 12, col);
            }
        },
        {
            id: 'n3', cat: 'Mechanics', title: "Newton's Third Law", icon: '💥',
            latex: '\\vec{F}_{AB}=-\\vec{F}_{BA}',
            desc: 'For every action there is an equal and opposite reaction. The compressed spring pushes both masses with the exact same force — the lighter one flies off faster, but their momenta are equal and opposite.',
            vars: [['F', 'contact force', 'N'], ['m<sub>A</sub>', 'mass A', 'kg'], ['m<sub>B</sub>', 'mass B', 'kg']],
            controls: [
                { k: 'mA', label: 'Mass A', min: 1, max: 8, step: 0.5, val: 2, unit: 'kg' },
                { k: 'mB', label: 'Mass B', min: 1, max: 8, step: 0.5, val: 4, unit: 'kg' }
            ],
            readout: p => [
                { l: '|F on A| = |F on B|', v: null },
                { l: 'Speed ratio v<sub>A</sub> : v<sub>B</sub>', v: p.mB / p.mA, u: '' }
            ],
            draw(ctx, p, t, P, col) {
                const T = 3.4, hold = 0.9, push = 0.6, Fc = 240, gap0 = 9;
                const tc = t % T, cx = LW / 2, trackY = 150;
                const aA = Fc / p.mA, aB = Fc / p.mB;          // same force, different masses
                const rA = 9 + p.mA * 2.4, rB = 9 + p.mB * 2.4;
                const yA = trackY - rA, yB = trackY - rB;

                // rest → spring pushes both apart → coast
                let dA = 0, dB = 0;
                const contact = tc < hold + push;
                if (tc >= hold) {
                    const tp = Math.min(tc - hold, push), tcoast = Math.max(0, tc - hold - push);
                    dA = 0.5 * aA * tp * tp + aA * push * tcoast;
                    dB = 0.5 * aB * tp * tp + aB * push * tcoast;
                }
                const xA = cx - gap0 - rA - dA, xB = cx + gap0 + rB + dB;

                trackH(ctx, trackY, P);

                // spring: between the ball faces while in contact, then left behind at rest
                const dAp = 0.5 * aA * push * push, dBp = 0.5 * aB * push * push;
                const p1x = contact ? xA + rA : cx - gap0 - dAp, p1y = yA;
                const p2x = contact ? xB - rB : cx + gap0 + dBp, p2y = yB;
                const sdx = p2x - p1x, sdy = p2y - p1y, slen = Math.hypot(sdx, sdy);
                const nxs = -sdy / slen, nys = sdx / slen;
                ctx.strokeStyle = P.track; ctx.lineWidth = 2; ctx.beginPath();
                const segs = 48;
                for (let i = 0; i <= segs; i++) {
                    const f = i / segs;
                    const amp = (i > 4 && i < segs - 4) ? 7 * Math.sin(f * 9 * TAU) : 0;

            const input = wrap.querySelector('input');
            input.addEventListener('input', () => {
                curParams[c.k] = parseFloat(input.value);
                document.getElementById('v-' + c.k).textContent = input.value;
                updateReadout();
            });
            cc.appendChild(wrap);
        });

        updateReadout();
        overlay.classList.add('open');
        overlay.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        fitCanvas();
        simStart = performance.now();
        cancelAnimationFrame(rafId);
        loop(simStart);
    }

    function updateReadout() {
        if (!curLaw) return;
        const arr = curLaw.readout(curParams);
        document.getElementById('m-readout').innerHTML = arr.map(r =>
            r.v === null
                ? `<span class="pill"><b>${r.l}</b></span>`
                : `<span class="pill">${r.l} = <b>${fmt(r.v)}</b> ${r.u}</span>`
        ).join('');
    }

    function loop(now) {
        const t = (now - simStart) / 1000, P = pal();
        ctx.clearRect(0, 0, LW, LH);
        try { curLaw.draw(ctx, curParams, t, P, curLaw.color); } catch (e) { }
        rafId = requestAnimationFrame(loop);
    }

    function closeModal() {
        overlay.classList.remove('open');
        overlay.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        cancelAnimationFrame(rafId);
        rafId = null; curLaw = null;
    }
    document.getElementById('closeBtn').addEventListener('click', closeModal);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal(); });

    // ---------- theme ----------
    const themeBtn = document.getElementById('themeToggle');
    function applyTheme(theme) {
        document.body.classList.toggle('light-theme', theme === 'light');
        try { localStorage.setItem('physTheme', theme); } catch (e) { }
    }
    themeBtn.addEventListener('click', () =>
        applyTheme(document.body.classList.contains('light-theme') ? 'dark' : 'light'));
    try { applyTheme(localStorage.getItem('physTheme') || 'dark'); } catch (e) { }

    // ---------- boot ----------
    renderCards();
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', renderMath);
    }
    window.addEventListener('load', renderMath); // ensure KaTeX (deferred) has loaded
    </script>
</body>
</html>
